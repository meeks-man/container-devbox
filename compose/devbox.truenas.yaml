# TrueNAS SCALE: Apps -> Discover -> Custom App -> Install via YAML, paste this.
#
# Before installing, create the dataset and directories described in
# docs/truenas.md. Replace POOL below with your pool name. Every path under
# See docs/truenas.md for dataset and permission setup.

services:
  devbox:
    image: ghcr.io/meeks-man/container-devbox:latest
    container_name: devbox
    hostname: devbox
    environment:
      # Run as this uid/gid. Must match the owner of the mounted directories.
      - PUID=1000
      - PGID=1000
      - TTYD_CREDENTIAL=USER:pick-a-strong-password
      - TZ=America/Chicago
    volumes:
      - /mnt/POOL/devboxs/USER/claude:/home/dev/.claude
      - /mnt/POOL/devboxs/USER/work:/home/dev/work
      - /mnt/POOL/devboxs/USER/kube:/home/dev/.kube
      - /mnt/POOL/devboxs/USER/talos:/home/dev/.talos
      - /mnt/POOL/devboxs/USER/local:/home/dev/.local/state
      - /mnt/POOL/devboxs/USER/gitconfig:/home/dev/.gitconfig
    ports:
      - '7681:7681'
    restart: unless-stopped
    init: true
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8g

  # Pulls the nightly image and recreates devbox when it changes.
  # --label-enable keeps it away from every other app on the NAS.
  watchtower:
    image: containrrr/watchtower
    container_name: devbox-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 3600
