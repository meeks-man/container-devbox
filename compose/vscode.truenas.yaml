# TrueNAS SCALE: Apps -> Discover -> Custom App -> Install via YAML.
# Shares the same per-user dataset as the devbox, so both containers see the
# same work files, kubeconfig, talosconfig, Claude session and git identity.
# Replace POOL and USER, and set PUID/PGID to the uid/gid that owns the dataset.
# Create the extra "vscode" directory first:  mkdir $D/vscode && chown 1000:1000 $D/vscode

services:
  vscode-USER:
    image: ghcr.io/meeks-man/container-vscode:latest
    container_name: vscode-USER
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - TITLE=VS Code
      # KasmVNC basic auth. Remove both when Caddy + Authentik sit in front.
      - CUSTOM_USER=USER
      - PASSWORD=pick-a-strong-password
    volumes:
      - /mnt/POOL/devboxs/USER/vscode:/config              # VS Code settings, extensions, desktop state
      - /mnt/POOL/devboxs/USER/work:/config/work
      - /mnt/POOL/devboxs/USER/kube:/config/.kube
      - /mnt/POOL/devboxs/USER/talos:/config/.talos
      - /mnt/POOL/devboxs/USER/claude:/config/.claude
      - /mnt/POOL/devboxs/USER/gitconfig:/config/.gitconfig
    ports:
      - '7690:3000'   # http
      - '7691:3001'   # https, self-signed
    shm_size: 1gb
    security_opt:
      - seccomp:unconfined   # Electron/Chromium sandboxing inside KasmVNC
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8g
