name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'compose/**'
      - 'docs/**'
      - '.yamllint.yaml'
  schedule:
    # Nightly at 05:17 UTC so the images pick up new upstream releases.
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: devbox
            file: images/devbox/Dockerfile
            description: Browser terminal (ttyd + tmux) with neovim, k9s, kubectl, talosctl, helm, kustomize, Claude Code, yazi and YAML tooling. Rebuilt nightly from upstream latest.
          - name: vscode
            file: images/vscode/Dockerfile
            description: Official VS Code desktop streamed via KasmVNC (linuxserver webtop), with the same CLI toolset as container-devbox. Rebuilt nightly from upstream latest.
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/container-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=container-${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}

      # no-cache is deliberate: the Dockerfiles fetch "latest" release URLs,
      # so a cached layer would silently pin old versions.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report installed versions
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE }}:latest -c devbox-versions | tee versions.txt
          { echo "## container-${{ matrix.name }} installed versions"; echo; echo '```'; cat versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
